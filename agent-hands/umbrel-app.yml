manifestVersion: "2.0.0"
id: agent-hands
name: Agent Hands
tagline: Настоящий Chrome для агента — руки на железе Umbrel
category: developer
version: "1.0.9"
port: 8080
description: >-
  Контейнер с настоящим Google Chrome, которым управляет агент по CDP.
  Внутри поднимается Xvfb, Chrome работает с постоянным профилем
  (cookies, история, логины сохраняются между перезапусками).
  CDP доступен контейнерам Umbrel: http://agent-hands_browser_1:9223/json/version
developer: Artem
website: ""
support: ""
icon: https://raw.githubusercontent.com/artemius125/umbrel-apps/main/icon.svg
gallery: []
releaseNotes: >-
  1.0.9 — PulseAudio по умолчанию 48 кГц (AudioContext как на десктопе).
  1.0.8 — виртуальные устройства 48 кГц: 2 mediaDevices и AudioContext 48000.
  1.0.7 — убраны унаследованные PULSE_SERVER/XDG_RUNTIME_DIR из образа.
  1.0.6 — PulseAudio запускается фоновым процессом (daemonize в контейнере падал).
  1.0.5 — PULSE_SERVER больше не наследуется от образа, звук реально поднимается.
  1.0.4 — починен запуск PulseAudio (устройства и 48 кГц), окно 1600x900 в openbox с панелью.
  1.0.3 — звук (null-sink/source), оконный менеджер с панелью, шрифты Ubuntu; CDP больше не публикуется в LAN, доступен только контейнерам Umbrel.
  1.0.2 — иконка грузится с GitHub, а не с локального сервера.
  1.0.1 — страница статуса показывает готовую ссылку на CDP вместо неработающей проверки.
  1.0.0 — первый выпуск: Chrome 158, Xvfb 1920x1080, CDP-релей на 9223, постоянный профиль.
dependencies: []
storage:
  dataRoot: data

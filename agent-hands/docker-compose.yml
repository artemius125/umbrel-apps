services:
  app_proxy:
    environment:
      APP_HOST: agent-hands_web_1
      APP_PORT: 8080

  web:
    image: busybox:1.37.0-musl
    user: "1000:1000"
    command: [httpd, -f, -p, "8080", -h, /site]
    volumes:
      - ${APP_DATA_DIR}/hooks/web:/site:ro
    restart: unless-stopped

  browser:
    image: 192.168.0.81:5000/agent-hands@sha256:04e9d8bf792ff4823b305b011ba62a4c713f79f3e75be8ba39ba7d228d7f1f0e
    init: true
    shm_size: "1g"
    cpus: 2.0
    mem_limit: 2g
    environment:
      CDP_RELAY_PORT: "9223"
      XVFB_SCREEN: "1920x1080x24"
    # порт НЕ публикуем наружу: CDP доступен только контейнерам Umbrel
    # (http://agent-hands_browser_1:9223), но не всей локальной сети
    volumes:
      - ${APP_DATA_DIR}/data:/profile
    restart: unless-stopped
